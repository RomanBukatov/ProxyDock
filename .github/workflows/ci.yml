name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Verify win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore ProxyDock.slnx

      - name: Build Release
        run: dotnet build ProxyDock.slnx -c Release --no-restore

      - name: Run automated tests
        env:
          PROXYDOCK_DISABLE_UPDATES: '1'
        run: |
          dotnet test tests/ProxyDock.Tests/ProxyDock.Tests.csproj `
            -c Release `
            --no-build `
            --filter "Category!=LocalLive" `
            --logger "trx;LogFileName=test-results.trx" `
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-win-x64
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Publish verification build (win-x64)
        run: |
          dotnet restore src/ProxyDock.App/ProxyDock.App.csproj -r win-x64
          dotnet publish src/ProxyDock.App/ProxyDock.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o publish/ci-win-x64

      - name: Smoke-test startup verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeDir = Join-Path $env:RUNNER_TEMP "proxydock-ci-smoke"
          $exePath = (Resolve-Path "publish/ci-win-x64/ProxyDock.exe").Path
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exePath
          $psi.Arguments = "--verify-startup --data-dir `"$smokeDir`""
          $psi.UseShellExecute = $false
          $psi.RedirectStandardError = $true

          $proc = [System.Diagnostics.Process]::Start($psi)
          $stderrTask = $proc.StandardError.ReadToEndAsync()
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill()
            throw "Smoke startup timed out after 30 seconds."
          }

          $stderr = $stderrTask.GetAwaiter().GetResult()
          if ($proc.ExitCode -ne 0) {
            if (-not [string]::IsNullOrWhiteSpace($stderr)) {
              Write-Host "StdErr:`n$stderr"
            }
            if (Test-Path (Join-Path $smokeDir "logs")) {
              Get-ChildItem (Join-Path $smokeDir "logs") -File | ForEach-Object {
                Write-Host "=== $($_.Name) ==="
                Get-Content $_.FullName
              }
            }
            throw "Smoke startup exited with code $($proc.ExitCode)"
          }

          if (-not (Test-Path (Join-Path $smokeDir "config"))) {
            throw "Smoke startup did not initialize expected data directory at $smokeDir"
          }
          Write-Host "Smoke startup verification succeeded (ExitCode=0, DataDir=$smokeDir)."
